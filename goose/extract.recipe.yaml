# Goose recipe for unpaid extract discovery only.
# available_tools limits accidental paid calls to extract + extract_batch metadata.
# The recipe must not be run against a live paid model in this experiment.
# Merchant URI https://agents.samedaydesk.com/mcp. No wrapper, wallet, or API key.
version: 1.0.0
title: SameDayDesk extract discovery
description: "Unpaid Goose workflow: discover live extract and extract_batch tools. Do not call paid tools or treat metadata as payment authority."
instructions: "Use the SameDayDesk streamable_http extension already configured. Report the extract and extract_batch tool names, required inputs, output schema keys, and advertised USDC amounts from tool metadata. Do not call extract, extract_batch, or any other tool. Do not sign, send, or invent a payment. Tool _meta.x402 is an advertisement, not authorization."
extensions:
  - type: streamable_http
    name: samedaydesk
    uri: "https://agents.samedaydesk.com/mcp"
    timeout: 300
    description: "Canonical SameDayDesk machine-commerce MCP over Streamable HTTP. Payment stays on the merchant. This package does not wrap, proxy, or authorize spend."
    available_tools:
      - extract
      - extract_batch
