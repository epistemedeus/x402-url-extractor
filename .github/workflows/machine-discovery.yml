name: Machine discovery and payment contract

on:
  pull_request:
    paths:
      - .github/workflows/machine-discovery.yml
      - server.js
      - machine-surface-parity.http.test.mjs
      - package-lock.json

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test machine-surface-parity.http.test.mjs gateway-landing.test.mjs startup-smoke.test.mjs
