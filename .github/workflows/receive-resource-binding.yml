name: Receive upstream resource binding correction
on:
  push:
    branches: [codex/receive-resource-binding-20261111]
    paths: [.github/workflows/receive-resource-binding.yml, verification/resource-binding/**]
permissions:
  contents: read
jobs:
  paired-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Receive both public source pins and run inert paired cases
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          cd "$work"
          npm install --ignore-scripts --no-audit --no-fund --no-save @x402/core@2.30.0 tokenizen-net-guard@0.1.0
          node "$GITHUB_WORKSPACE/verification/resource-binding/receive.mjs"
