name: Seller audit input replay
on:
  push:
    branches: [codex/audit-input-replay-20261115]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test seller-integrity-audit.test.mjs experiments/audit-input-replay/input-proof.test.mjs
