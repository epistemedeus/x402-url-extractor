name: Verify cold recovery past payment expiry

on:
  push:
    branches: [codex/verify-recovery-after-payment-expiry]

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: node --test mcp-task-recovery.test.mjs caller-result-client/test/recovery.test.mjs
