name: apply-remaining-gb10-patch
on:
  push:
    branches: [gb10-x402-monitor]
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore large files from master and apply the remaining patch
        run: |
          set -euo pipefail
          if [ ! -f patches/remaining.patch ]; then
            echo "patch already applied"
            exit 0
          fi
          git fetch origin master
          git checkout origin/master -- package-lock.json commerce-events.mjs commerce-events.test.mjs server.js
          git apply patches/remaining.patch
          rm -f patches/remaining.patch .github/workflows/apply-remaining-gb10-patch.yml
          rmdir patches 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply remaining GB10/GB11 server and catalog updates."
          git push
