name: Receive opportunity comparison evidence validity
on:
  push:
    branches: ['codex/receive-compare-evidence-validity-20261115']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Verify exact product tree and run installed and mounted MCP controls
        run: |
          test "$(git rev-parse HEAD^)" = '697b539ae647cb2dc23b9ec4ff1ae48465531445'
          git diff --exit-code HEAD^ HEAD -- vendor/opportunity-eligibility opportunity-compare-mcp.test.mjs
          npm ci --ignore-scripts --no-audit --no-fund
          timeout --kill-after=5s 90s node --test --test-reporter=tap opportunity-compare-mcp.test.mjs
