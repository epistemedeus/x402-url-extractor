[project]
name = "samedaydesk-agentverse-a2a"
version = "0.1.0"
description = "Thin Agentverse bridge for the canonical SameDayDesk A2A storefront"
requires-python = ">=3.10"
dependencies = [
  "a2a-sdk[http-server]==1.1.2",
  "agentverse-sdk[a2a]==0.2.1",
  "httpx==0.28.1",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
py-modules = ["catalog_proxy", "main"]
